<button onclick="generatePasswordDariWeb()">🔐 Generate Password Siswa</button>

<script>
  const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbybDD8lkDtQ2CAWYyR5Vn_kwr34aqor6WjMV6o56agYIhw_qrwBen_KZYRXKlC_xrsJ/exec";

  async function generatePasswordDariWeb() {
    if (!confirm("Generate password baru untuk semua siswa?")) return;
    
    const res = await fetch(URL_APPS_SCRIPT + "?action=generatePassword");
    const hasil = await res.json();
    alert(hasil.pesan);
    location.reload(); // Refresh tabel data siswa di frontend
  }
</script>
